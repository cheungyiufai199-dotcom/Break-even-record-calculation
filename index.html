<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大輝記賬 - 收支損益管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">
  <div class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- Header -->
    <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-xl font-bold text-slate-900">收支損益計算器</h1>
        <p class="text-xs text-slate-500">Firebase 雲端實時同步中</p>
      </div>
      <div id="connectionStatus" class="flex items-center gap-1.5 text-xs text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full font-medium">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 連線中...
      </div>
    </header>

    <!-- Financial Summary Cards -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-emerald-50 border border-emerald-100 p-3.5 rounded-xl text-center">
        <div class="text-xs text-emerald-600 font-medium">本月總收入</div>
        <div id="totalIncome" class="text-lg font-bold text-emerald-700 mt-1">$0</div>
      </div>
      <div class="bg-rose-50 border border-rose-100 p-3.5 rounded-xl text-center">
        <div class="text-xs text-rose-600 font-medium">本月總支出</div>
        <div id="totalExpense" class="text-lg font-bold text-rose-700 mt-1">$0</div>
      </div>
      <div class="bg-blue-50 border border-blue-100 p-3.5 rounded-xl text-center">
        <div class="text-xs text-blue-600 font-medium">實時結餘</div>
        <div id="netBalance" class="text-lg font-bold text-blue-700 mt-1">$0</div>
      </div>
    </div>

    <!-- Quick Add Form -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-base font-semibold text-slate-900">新增一筆記錄</h2>
      <form id="recordForm" class="space-y-3">
        
        <!-- Type Selection -->
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
          <button type="button" id="btnExpense" class="py-2 text-sm font-semibold rounded-lg bg-white text-rose-600 shadow-sm transition">支出</button>
          <button type="button" id="btnIncome" class="py-2 text-sm font-semibold rounded-lg text-slate-600 transition">收入</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">金額 (HK$)</label>
            <input type="number" step="0.5" id="amount" placeholder="0.00" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">分類</label>
            <select id="category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
              <option value="食飯飲食">🍜 食飯飲食</option>
              <option value="搭車交通">🚇 搭車交通</option>
              <option value="屋企雜項">🏠 屋企雜項</option>
              <option value="娛樂購物">🛍️ 娛樂購物</option>
              <option value="工作薪金">💼 工作薪金</option>
              <option value="其他雜費">📦 其他雜費</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">備註說明</label>
            <input type="text" id="description" placeholder="例: 茶餐廳午餐 / 八達通增值" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
            <input type="date" id="recordDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
          <span>儲存到雲端</span>
        </button>
      </form>
    </div>

    <!-- History List -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-semibold text-slate-900">最新收支流水</h2>
        <span id="recordCount" class="text-xs text-slate-400">0 筆記錄</span>
      </div>
      <div id="recordList" class="space-y-2 max-h-96 overflow-y-auto pr-1">
        <div class="text-center py-8 text-xs text-slate-400">載入中...</div>
      </div>
    </div>

  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // 你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyBFfgFYyh1AGvpBYHdRUtHsnBz6pawPZOI",
      authDomain: "break-even-record-calculation.firebaseapp.com",
      databaseURL: "https://break-even-record-calculation-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "break-even-record-calculation",
      storageBucket: "break-even-record-calculation.firebasestorage.app",
      messagingSenderId: "963032266930",
      appId: "1:963032266930:web:23f60bb6409e55f1e371ab",
      measurementId: "G-0RH7CCVNB6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const recordsRef = ref(db, "expenses_records");

    // 預設日期為今日
    const dateInput = document.getElementById("recordDate");
    dateInput.value = new Date().toISOString().split("T")[0];

    // 收支切換
    let currentType = "expense";
    const btnExpense = document.getElementById("btnExpense");
    const btnIncome = document.getElementById("btnIncome");

    btnExpense.addEventListener("click", () => {
      currentType = "expense";
      btnExpense.className = "py-2 text-sm font-semibold rounded-lg bg-white text-rose-600 shadow-sm transition";
      btnIncome.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 transition";
    });

    btnIncome.addEventListener("click", () => {
      currentType = "income";
      btnIncome.className = "py-2 text-sm font-semibold rounded-lg bg-white text-emerald-600 shadow-sm transition";
      btnExpense.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 transition";
    });

    // 實時監聽數據庫變化
    onValue(recordsRef, (snapshot) => {
      const statusEl = document.getElementById("connectionStatus");
      statusEl.className = "flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full font-medium";
      statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 實時同步中';

      const data = snapshot.val();
      const listEl = document.getElementById("recordList");
      listEl.innerHTML = "";

      let totalInc = 0;
      let totalExp = 0;
      let items = [];

      if (data) {
        Object.entries(data).forEach(([key, val]) => {
          items.push({ id: key, ...val });
          const amt = parseFloat(val.amount) || 0;
          if (val.type === "income") totalInc += amt;
          else totalExp += amt;
        });
      }

      // 更新頂部卡片
      document.getElementById("totalIncome").textContent = `$${totalInc.toLocaleString("en-US", { minimumFractionDigits: 1 })}`;
      document.getElementById("totalExpense").textContent = `$${totalExp.toLocaleString("en-US", { minimumFractionDigits: 1 })}`;
      const net = totalInc - totalExp;
      const netEl = document.getElementById("netBalance");
      netEl.textContent = `$${net.toLocaleString("en-US", { minimumFractionDigits: 1 })}`;
      netEl.className = `text-lg font-bold mt-1 ${net >= 0 ? "text-blue-700" : "text-rose-700"}`;
      document.getElementById("recordCount").textContent = `${items.length} 筆記錄`;

      if (items.length === 0) {
        listEl.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">目前未有記錄，即刻記低第一筆！</div>';
        return;
      }

      // 按日期倒序排列
      items.sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt);

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-100 transition";
        const isExp = item.type === "expense";
        
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-lg">${item.category.split(" ")[0]}</div>
            <div>
              <div class="text-xs font-semibold text-slate-800">${item.description || item.category.split(" ")[1]}</div>
              <div class="text-[11px] text-slate-400">${item.date} · ${item.category}</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-bold ${isExp ? 'text-rose-600' : 'text-emerald-600'}">
              ${isExp ? '-' : '+'}$${parseFloat(item.amount).toLocaleString('en-US', { minimumFractionDigits: 1 })}
            </span>
            <button data-id="${item.id}" class="btn-delete text-slate-300 hover:text-rose-500 text-xs px-1.5 py-1">✕</button>
          </div>
        `;
        listEl.appendChild(row);
      });

      // 綁定刪除事件
      document.querySelectorAll(".btn-delete").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const id = e.target.getAttribute("data-id");
          if (confirm("確認刪除呢筆記錄？")) {
            remove(ref(db, `expenses_records/${id}`));
          }
        });
      });
    }, (error) => {
      const statusEl = document.getElementById("connectionStatus");
      statusEl.className = "flex items-center gap-1.5 text-xs text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full font-medium";
      statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> 連線受限';
      alert("Firebase 連線失敗，請檢查 Realtime Database Rules 權限設定！");
    });

    // 表單提交
    document.getElementById("recordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const amount = document.getElementById("amount").value;
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value;
      const date = document.getElementById("recordDate").value;

      if (!amount || isNaN(amount) || Number(amount) <= 0) {
        alert("請輸入有效金額");
        return;
      }

      await push(recordsRef, {
        type: currentType,
        amount: parseFloat(amount),
        category,
        description,
        date,
        createdAt: Date.now()
      });

      document.getElementById("amount").value = "";
      document.getElementById("description").value = "";
    });
  </script>
</body>
</html>
