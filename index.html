<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
/* 全域強制黑色底色深色主題 */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",PingFang TC,Noto Sans TC,sans-serif;}
body{background:#0a0a0a;color:#f0f0f0;min-height:100vh;padding:15px;transition:background 0.3s,color 0.3s;}
.light-mode{background:#ffffff;color:#111111;}
.container{max-width:750px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #333;}
.light-mode .header{border-bottom:1px solid #ddd;}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:15px;margin:3px;}
.btn-google{background:#4285f4;color:#fff;}
.btn-logout{background:#d93025;color:#fff;display:none;}
.btn-theme{background:#444;color:#fff;}
.light-mode .btn-theme{background:#eee;color:#111;}
.card{background:#181818;border-radius:10px;padding:18px;margin-bottom:15px;border:1px solid #272727;}
.light-mode .card{background:#f8f8f8;border:1px solid #e5e5e5;}
.form-item{margin:12px 0;}
label{display:block;margin-bottom:6px;}
input,select{width:100%;padding:10px;border-radius:6px;background:#222;border:1px solid #3a3a3a;color:#fff;font-size:15px;}
.light-mode input,.light-mode select{background:#fff;border:#ccc;color:#111;}
.operate-bar{margin:15px 0;display:flex;flex-wrap:wrap;gap:8px;}
.chart-box{height:320px;margin:20px 0;}
.list-item{padding:10px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;}
.light-mode .list-item{border-bottom:1px solid #eee;}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;z-index:9999;display:none;}
.tip-popup{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:6px;background:#222;color:#fff;z-index:9998;display:none;}
</style>
</head>

<div class="tip-popup" id="tipBox"></div>
<div class="container">
  <div class="header">

    <div>
      <button class="btn btn-google" id="loginBtn">Google帳號登入</button>

      <button class="btn btn-theme" id="themeBtn">切換主題</button>
    </div>
  </div>

  <!-- 新增收支表單 -->
  <div class="card" id="addBillBox" style="display:none;">
    <h3>新增收支記錄</h3>
    <div class="form-item">
      <label>類型</label>
      <select id="billType">
        <option value="income">收入</option>
        <option value="pay">支出</option>
      </select>
    </div>
    <div class="form-item">
      <label>金額</label>
      <input type="number" id="billMoney" placeholder="輸入數字金額" min="0" step="0.01">
    </div>
    <div class="form-item">
      <label>分類</label>
      <select id="billClass">
        <option value="飲食">飲食</option>
        <option value="交通">交通</option>
        <option value="購物">購物</option>
        <option value="工資">工資</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-item">
      <label>備註</label>
      <input type="text" id="billRemark" placeholder="簡單備註說明">
    </div>
    <button class="btn" style="background:#28a745;color:#fff;width:100%;margin-top:10px;" id="submitBill">儲存記錄</button>
  </div>

  <!-- 數據統計圖表 -->
  <div class="card" id="chartBox" style="display:none;">
    <h3>本月收支統計</h3>

      <canvas id="myChart"></canvas>

  </div>

  <!-- 記錄清單 -->
  <div class="card" id="listBox" style="display:none;">
    <h3>收支明細清單</h3>
    <div id="billList"></div>
  </div>
</div>

<script>
// Firebase 配置資訊
const firebaseConfig = {
  apiKey: "AIzaSyCnToMYsM7pIGeGHLt5xFbQfT5RAIWzTQA",
  authDomain: "van-v9-41439.firebaseapp.com",
  databaseURL: "https://van-v9-41439-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "van-v9-41439",
  storageBucket: "van-v9-41439.firebasestorage.app",
  messagingSenderId: "434512345678"
};

// 初始化Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
let currentUser = null;
let chartInstance = null;

// DOM物件
const loading = document.getElementById('loading');
const tipBox = document.getElementById('tipBox');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const themeBtn = document.getElementById('themeBtn');
const addBillBox = document.getElementById('addBillBox');
const chartBox = document.getElementById('chartBox');
const listBox = document.getElementById('listBox');

// 彈窗提示函數
function showTip(msg, time=2000){
  tipBox.innerText = msg;
  tipBox.style.display = 'block';
  setTimeout(()=>{tipBox.style.display='none'}, time);
}

// 載入顯示控制
function setLoading(show){
  loading.style.display = show ? 'flex' : 'none';
}

// 主題切換
themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('light-mode');
});

// Google登入流程
loginBtn.addEventListener('click',async ()=>{
  setLoading(true);
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(err){
    setLoading(false);
    showTip('登入失敗：'+err.message);
    console.error('登入錯誤',err);
  }
});

// 登出
logoutBtn.addEventListener('click',async ()=>{
  setLoading(true);
  try{
    await auth.signOut();
    showTip('已成功登出');
  }catch(err){
    setLoading(false);
    showTip('登出異常：'+err.message);
  }
});

// 監測登入狀態
auth.onAuthStateChanged(user=>{
  setLoading(false);
  currentUser = user;
  if(user){
    // 已登入：切換按鈕、顯示功能介面
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    addBillBox.style.display = 'block';
    chartBox.style.display = 'block';
    listBox.style.display = 'block';
    loadBillData();
  }else{
    // 未登入：隱藏全部功能
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    addBillBox.style.display = 'none';
    chartBox.style.display = 'none';
    listBox.style.display = 'none';
    currentUser = null;
    if(chartInstance) chartInstance.destroy();
  }
});

// 儲存收支記錄
document.getElementById('submitBill').addEventListener('click',async ()=>{
  if(!currentUser) return showTip('請先登入Google帳號');
  const type = document.getElementById('billType').value;
  const money = parseFloat(document.getElementById('billMoney').value);
  const cls = document.getElementById('billClass').value;
  const remark = document.getElementById('billRemark').value.trim();

  if(isNaN(money) || money <=0) return showTip('請輸入正確金額');
  setLoading(true);

  try{
    const uid = currentUser.uid;
    const newBill = {
      uid:uid,
      type:type,
      money:money,
      classify:cls,
      remark:remark,
      time:new Date().getTime(),
      dateStr:new Date().toLocaleString('zh-HK')
    };
    await db.ref('bills/'+uid).push(newBill);
    // 清空輸入框
    document.getElementById('billMoney').value = '';
    document.getElementById('billRemark').value = '';
    showTip('記錄儲存成功');
    loadBillData();
  }catch(err){
    showTip('儲存失敗，檢查資料庫權限：'+err.message);
    console.error(err);
  }finally{
    setLoading(false);
  }
});

// 載入用戶帳單數據並渲染清單+圖表
async function loadBillData(){
  if(!currentUser) return;
  setLoading(true);
  try{
    const snapshot = await db.ref('bills/'+currentUser.uid).orderByChild('time').once('value');
    const bills = [];
    snapshot.forEach(item=>{
      bills.push({id:item.key,...item.val()});
    });
    renderList(bills);
    renderChart(bills);
  }catch(err){
    showTip('讀取數據失敗，Firebase連線/權限異常：'+err.message);
    console.error(err);
  }finally{
    setLoading(false);
  }
}

// 渲染明細清單
function renderList(bills){
  const wrap = document.getElementById('billList');
  if(bills.length ===0){
    wrap.innerHTML = '<div style="padding:10px;text-align:center;">暫無收支記錄</div>';
    return;
  }
  let html = '';
  bills.reverse().forEach(item=>{
    const sign = item.type === 'income' ? '+' : '-';
    const color = item.type === 'income' ? '#36d399' : '#f87272';
    html += `
    <div class="list-item">
      <div>
        <div>${item.dateStr}｜${item.classify}｜${item.remark||'無備註'}</div>
      </div>
      <div style="color:${color};font-weight:bold;">${sign}$${item.money.toFixed(2)}</div>
    </div>`;
  });
  wrap.innerHTML = html;
}

// 繪製統計圖表
function renderChart(bills){
  // 銷毀舊圖防止重疊卡頓
  if(chartInstance) chartInstance.destroy();
  let totalIncome = 0, totalPay =0;
  bills.forEach(item=>{
    if(item.type === 'income') totalIncome += item.money;
    else totalPay += item.money;
  });

  const ctx = document.getElementById('myChart').getContext('2d');
  // 深色模式圖表配色自動适配
  const textColor = document.body.classList.contains('light-mode') ? '#111' : '#eee';
  chartInstance = new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['總收入','總支出'],
      datasets:[{
        data:[totalIncome,totalPay],
        backgroundColor:['#36d399','#f87272']
      }]
    },
    options:{
      plugins:{
        legend:{labels:{color:textColor}}
      }
    }
  });
}
</script>
</body>

    const searchType = $('searchType');
    const searchDateFrom = $('searchDateFrom');
    const searchDateTo = $('searchDateTo');
    const searchAmountMin = $('searchAmountMin');
    const searchAmountMax = $('searchAmountMax');
    const searchBtn = $('searchBtn');
    const clearSearchBtn = $('clearSearchBtn');
    const exportCsvBtn = $('exportCsvBtn');
    const csvFileInput = $('csvFileInput');
    const showTrashBtn = $('showTrashBtn');
    const trashModal = $('trashModal');
    const closeTrashBtn = $('closeTrashBtn');
    const trashList = $('trashList');
    const emptyTrashBtn = $('emptyTrashBtn');
    const budgetList = $('budgetList');
    const budgetStatus = $('budgetStatus');
    const compareCurrent = $('compareCurrent');
    const compareLast = $('compareLast');
    const compareDiff = $('compareDiff');
    const todayBadge = $('todayBadge');
    const quickActions = document.getElementById('quickActions');

    // ---------- 輔助 ----------
    function todayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function formatDate(dateStr) { const p = dateStr.split('-'); return p[1]+'/'+p[2]; }
    function formatCurrency(amount) { return currencySymbol + amount.toFixed(2); }
    function generateId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
    function getMonthEntries(entries, year, month) {
        const prefix = year + '-' + String(month).padStart(2,'0');
        return entries.filter(e => e.date && e.date.startsWith(prefix));
    }
    function calcStats(entries) {
        let inc=0, exp=0;
        entries.forEach(e => { if(e.type==='income') inc+=e.amount; else exp+=e.amount; });
        return { income: inc, expense: exp, balance: inc-exp };
    }
    // 清理垃圾桶30日過期記錄
    function cleanExpiredTrash(){
        if(!trashRef) return;
        const nowTs = Date.now();
        trashRef.once('value').then(snap=>{
            const data = snap.val();
            if(!data) return;
            const toRemove = [];
            Object.entries(data).forEach(([key,item])=>{
                if(item.deletedAt && (nowTs - item.deletedAt > TRASH_EXPIRE_MS)){
                    toRemove.push(key);
                }
            });
            toRemove.forEach(k=>trashRef.child(k).remove());
        })
    }

    // ---------- 渲染 ----------
    function renderDashboard() {
        const monthEntries = getMonthEntries(allEntries, currentYear, currentMonth);
        const stats = calcStats(monthEntries);
        totalIncome.textContent = formatCurrency(stats.income);
        totalExpense.textContent = formatCurrency(stats.expense);
        totalBalance.textContent = formatCurrency(stats.balance);
        currentMonthLabel.textContent = currentYear + '年' + currentMonth + '月';
        const now = new Date();
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        let dayNow = (currentYear===now.getFullYear() && currentMonth===now.getMonth()+1) ? now.getDate() : daysInMonth;
        if (dayNow > daysInMonth) dayNow = daysInMonth;
        const avg = dayNow>0 ? stats.expense/dayNow : 0;
        dailyAvg.textContent = formatCurrency(avg);
        const left = daysInMonth - dayNow;
        daysLeft.textContent = left;
        renderBudget(monthEntries);
        const lastMonth = currentMonth===1 ? 12 : currentMonth-1;
        const lastYear = currentMonth===1 ? currentYear-1 : currentYear;
        const lastEntries = getMonthEntries(allEntries, lastYear, lastMonth);
        const lastStats = calcStats(lastEntries);
        const curExp = stats.expense, lastExp = lastStats.expense;
        compareCurrent.textContent = formatCurrency(curExp);
        compareLast.textContent = formatCurrency(lastExp);
        if (lastExp>0) {
            const diff = ((curExp - lastExp)/lastExp*100);
            compareDiff.textContent = (diff>0?'+':'') + diff.toFixed(1) + '%';
            compareDiff.style.color = diff>0 ? '#b91c1c' : '#0b8a5e';
        } else { compareDiff.textContent = '--'; }
        updateCharts(monthEntries);
        if (searchResults.length === 0) {
            renderEntryList(monthEntries);
            resultCount.textContent = monthEntries.length + ' 筆';
        } else {
            renderEntryList(searchResults);
            resultCount.textContent = searchResults.length + ' 筆';
        }
    }

    function renderEntryList(entries) {
        if (!entries || entries.length===0) {
            entryList.innerHTML = '<li class="empty-state">📭 冇記錄</li>';
            return;
        }
        const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
        let html = '';
        sorted.forEach(e => {
            const cls = e.type==='income'?'income':'expense';
            const sign = e.type==='income'?'+':'-';
            const cat = e.category || (e.type==='income'?'收入':'支出');
            const note = e.note ? ' 📝'+e.note : '';
            html += `<li>
                <div class="entry-info">
                    <span class="entry-cat">${cat}${note}</span>
                    <span class="entry-meta">
                        <span>${formatDate(e.date)}</span>
                        <span class="tag">${e.type==='income'?'收入':'支出'}</span>
                    </span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <span class="entry-amount ${cls}">${sign}${formatCurrency(e.amount)}</span>
                    <button class="del-btn" data-id="${e.id}">✕</button>
                </div>
            </li>`;
        });
        entryList.innerHTML = html;
        document.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                if (confirm('刪除呢條記錄？可喺垃圾桶還原。')) {
                    moveToTrash(id);
                }
            });
        });
    }

    function renderBudget(monthEntries) {
        if (!budgetList) return;
        let budgetMap = {};
        try {
            const raw = localStorage.getItem('dahui_budget');
            if (raw) budgetMap = JSON.parse(raw);
        } catch(e) {}
        if (Object.keys(budgetMap).length===0) {
            budgetList.innerHTML = '<div class="text-muted" style="text-align:center;padding:8px;">未設定預算，請到「設定」頁新增</div>';
            budgetStatus.textContent = '未設定';
            return;
        }
        const catSpend = {};
        monthEntries.forEach(e => {
            if (e.type==='expense') {
                const cat = e.category || '其他';
                catSpend[cat] = (catSpend[cat]||0) + e.amount;
            }
        });
        let html = '', overCount = 0;
        for (const [cat, limit] of Object.entries(budgetMap)) {
            const spent = catSpend[cat] || 0;
            const pct = limit>0 ? (spent/limit*100) : 0;
            const cls = pct>=100 ? 'danger' : (pct>=80 ? 'warning' : '');
            if (pct>=100) overCount++;
            html += `<div class="budget-item">
                <span class="b-label">${cat}</span>
                <div class="b-bar"><div class="b-fill ${cls}" style="width:${Math.min(pct,100)}%;"></div></div>
                <span class="b-text">${formatCurrency(spent)} / ${formatCurrency(limit)}</span>
            </div>`;
        }
        budgetList.innerHTML = html || '<div class="text-muted">未有分類預算</div>';
        budgetStatus.textContent = overCount>0 ? `⚠️ ${overCount}項超支` : '✅ 正常';
        budgetStatus.style.color = overCount>0 ? '#b91c1c' : '#0b8a5e';
    }

    function updateCharts(monthEntries) {
        const catMap = {};
        monthEntries.forEach(e => {
            if (e.type==='expense') {
                const cat = e.category || '其他';
                catMap[cat] = (catMap[cat]||0) + e.amount;
            }
        });
        const labels = Object.keys(catMap);
        const data = Object.values(catMap);
        const colors = ['#4f46e5','#f59e0b','#ef4444','#10b981','#8b5cf6','#ec4899','#14b8a6','#f97316'];
        const ctxPie = document.getElementById('pieChart').getContext('2d');
        if (chartPie) chartPie.destroy();
        chartPie = new Chart(ctxPie, {
            type: 'pie',
            data: { labels, datasets: [{ data, backgroundColor: colors.slice(0,labels.length), borderWidth:0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth:12, font:{size:10} } } } }
        });
        const days = new Date(currentYear, currentMonth, 0).getDate();
        const dailyExp = new Array(days).fill(0);
        const dailyInc = new Array(days).fill(0);
        monthEntries.forEach(e => {
            const day = parseInt(e.date.split('-')[2]) - 1;
            if (day>=0 && day<days) {
                if (e.type==='expense') dailyExp[day] += e.amount;
                else dailyInc[day] += e.amount;
            }
        });
        const dayLabels = Array.from({length:days}, (_,i) => (i+1)+'日');
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        if (chartLine) chartLine.destroy();
        chartLine = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: dayLabels,
                datasets: [
                    { label: '支出', data: dailyExp, borderColor: '#b91c1c', backgroundColor: 'rgba(185,28,28,0.1)', fill: true, tension:0.3, pointRadius:2 },
                    { label: '收入', data: dailyInc, borderColor: '#0b8a5e', backgroundColor: 'rgba(11,138,94,0.1)', fill: true, tension:0.3, pointRadius:2 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { boxWidth:12, font:{size:10} } } }, scales: { y: { beginAtZero: true } } }
        });
    }

    // ---------- Firebase 監聽 ----------
    function attachDatabaseListener(user) {
        if (dbRef) { dbRef.off(); }
        if (trashRef) { trashRef.off(); }
        dbRef = database.ref('users/' + user.uid + '/entries');
        trashRef = database.ref('users/' + user.uid + '/trash');
        cleanExpiredTrash();
        dbRef.on('value', snapshot => {
            const data = snapshot.val();
            if (data) {
                allEntries = Object.keys(data).map(k => ({ ...data[k], id: k }));
            } else { allEntries = []; }
            searchResults = [];
            renderDashboard();
        });
        trashRef.on('value', snapshot => {
            const data = snapshot.val();
            if (data) {
                trashEntries = Object.keys(data).map(k => ({ ...data[k], id: k, trashKey: k }));
            } else { trashEntries = []; }
        });
    }

    // ---------- 核心操作 ----------
    function addEntry(clearAfter=true) {
        if (!currentUser) { alert('未登入，請等一陣再試'); return; }
        const type = typeSelect.value;
        let category = categoryInput.value.trim() || (type==='income'?'收入':'支出');
        const amount = parseFloat(amountInput.value);
        let date = dateInput.value || todayStr();
        const note = noteInput.value.trim() || '';
        if (isNaN(amount) || amount<=0) { alert('請輸入有效金額 (>0)'); amountInput.focus(); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('日期格式錯誤'); dateInput.focus(); return; }
        const id = generateId();
        const entry = { type, category, amount, date, note, createdAt: Date.now() };
        dbRef.child(id).set(entry).then(() => {
            if (clearAfter) {
                amountInput.value = '';
                categoryInput.value = '';
                noteInput.value = '';
                dateInput.value = todayStr();
                amountInput.focus();
            }
        }).catch(err => alert('儲存失敗: '+err.message));
    }

    function moveToTrash(id) {
        if (!currentUser || !dbRef) return;
        const entry = allEntries.find(e => e.id===id);
        if (!entry) return;
        dbRef.child(id).remove().then(() => {
            const trashId = generateId();
            trashRef.child(trashId).set({ ...entry, deletedAt: Date.now() });
        }).catch(err => alert('刪除失敗: '+err.message));
    }

    function restoreFromTrash(trashKey) {
        if (!currentUser || !trashRef) return;
        const item = trashEntries.find(t => t.trashKey===trashKey);
        if (!item) return;
        trashRef.child(trashKey).remove().then(() => {
            const { trashKey, ...rest } = item;
            dbRef.child(rest.id).set(rest);
        }).catch(err => alert('還原失敗: '+err.message));
    }

    function emptyTrash() {
        if (!currentUser || !trashRef) return;
        if (trashEntries.length===0) return;
        if (confirm('確定清空垃圾桶？')) {
            trashRef.remove().catch(err => alert('清空失敗: '+err.message));
        }
    }

    function exportCSV() {
        if (allEntries.length===0) { alert('冇記錄可匯出'); return; }
        let csv = '日期,類型,分類,金額,備註\n';
        allEntries.forEach(e => {
            csv += `${e.date},${e.type},${e.category||''},${e.amount},${e.note||''}\n`;
        });
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `大輝記賬_${todayStr()}.csv`;
        link.click();
    }

    function importCSV(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const lines = text.split('\n').filter(line => line.trim()!=='');
            if (lines.length<2) { alert('CSV 格式唔啱'); return; }
            const headers = lines[0].split(',').map(h => h.trim());
            const idx = { date: headers.indexOf('日期'), type: headers.indexOf('類型'), category: headers.indexOf('分類'), amount: headers.indexOf('金額'), note: headers.indexOf('備註') };
            if (idx.date===-1 || idx.type===-1 || idx.amount===-1) { alert('CSV 缺少必要欄位'); return; }
            let count=0;
            for (let i=1; i<lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.trim());
                const date = cols[idx.date] || todayStr();
                const type = (cols[idx.type]||'expense').toLowerCase()==='income'?'income':'expense';
                const category = cols[idx.category] || (type==='income'?'收入':'支出');
                const amount = parseFloat(cols[idx.amount]);
                const note = cols[idx.note] || '';
                if (isNaN(amount) || amount<=0) continue;
                const id = generateId();
                dbRef.child(id).set({ type, category, amount, date, note, createdAt: Date.now() });
                count++;
            }
            alert('匯入完成！共 '+count+' 筆');
        };
        reader.readAsText(file);
    }

    function doSearch() {
        const kw = searchKeyword.value.trim().toLowerCase();
        const type = searchType.value;
        const from = searchDateFrom.value;
        const to = searchDateTo.value;
        const min = parseFloat(searchAmountMin.value) || 0;
        const max = parseFloat(searchAmountMax.value) || Infinity;
        let results = allEntries.filter(e => {
            if (type && e.type!==type) return false;
            if (from && e.date < from) return false;
            if (to && e.date > to) return false;
            if (e.amount < min || e.amount > max) return false;
            if (kw) {
                const cat = (e.category||'').toLowerCase();
                const note = (e.note||'').toLowerCase();
                if (!cat.includes(kw) && !note.includes(kw)) return false;
            }
            return true;
        });
        searchResults = results;
        renderEntryList(results);
        resultCount.textContent = results.length + ' 筆';
    }

    function setTheme(theme) {
        document.body.className = '';
        if (theme==='dark') document.body.classList.add('theme-dark');
        else if (theme==='orange') document.body.classList.add('theme-orange');
        localStorage.setItem('dahui_theme', theme);
        themeSelect.value = theme;
    }

    function renderTrashModal() {
        if (!trashList) return;
        if (trashEntries.length === 0) {
            trashList.innerHTML = '<li class="empty-state">垃圾桶係空嘅</li>';
            return;
        }
        let html = '';
        trashEntries.forEach(item => {
            const cls = item.type === 'income' ? 'income' : 'expense';
            const sign = item.type === 'income' ? '+' : '-';
            html += `<li style="padding:10px 0;border-bottom:1px solid var(--border);">
                <div><strong>${item.category || ''}</strong> ${sign}${formatCurrency(item.amount)}</div>
                <div class="text-muted">${formatDate(item.date)}｜刪除時間：${new Date(item.deletedAt).toLocaleString()}</div>
                <div class="btn-group" style="margin-top:6px;">
                    <button class="btn btn-primary btn-sm restore-btn" data-trashkey="${item.trashKey}">🔄 還原</button>
                </div>
            </li>`;
        });
        trashList.innerHTML = html;
        document.querySelectorAll('.restore-btn').forEach(b => {
            b.addEventListener('click', function () {
                const key = this.dataset.trashkey;
                restoreFromTrash(key);
                trashModal.style.display = 'none';
            });
        });
    }

    // ---------- 初始化 ----------
    function init() {
        // Tab切換
        document.querySelectorAll('#mainTabs button[data-tab]').forEach(tabBtn=>{
            tabBtn.addEventListener('click',()=>{
                const targetTabId = tabBtn.dataset.tab;
                document.querySelectorAll('#mainTabs button').forEach(b=>b.classList.remove('active'));
                tabBtn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
                document.getElementById(targetTabId).classList.add('active');
            })
        })

        dateInput.value = todayStr();
        todayBadge.textContent = '今日 '+todayStr();
        const savedCurrency = localStorage.getItem('dahui_currency') || '$';
        currencySymbol = savedCurrency;
        currencySelect.value = savedCurrency;
        const savedTheme = localStorage.getItem('dahui_theme') || 'default';
        setTheme(savedTheme);
        const savedCats = localStorage.getItem('dahui_custom_cats');
        if (savedCats) {
            customCats.value = savedCats;
            const datalist = document.getElementById('catSuggest');
            datalist.innerHTML = savedCats.split(',').map(s=>s.trim()).filter(Boolean).map(c => `<option value="${c}">`).join('');
        }

        // 匿名登入
        auth.signInAnonymously().catch(err => {
            console.error('匿名登入失敗:', err);
            userInfo.innerHTML = '❌ 登入失敗';
            alert('❌ 匿名登入失敗：' + err.message + '\n\n請確認你已經喺 Firebase Console 啟用「匿名登入」功能。');
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                const displayName = user.isAnonymous ? '匿名用戶' : (user.displayName || user.email || '用戶');
                userInfo.innerHTML = `👤 <span>${displayName}</span>`;
                attachDatabaseListener(user);
                document.getElementById('addCard').classList.remove('disabled-overlay');
            } else {
                currentUser = null;
                userInfo.innerHTML = '🚫 未連線';
                if (dbRef) { dbRef.off(); dbRef=null; }
                if (trashRef) { trashRef.off(); trashRef=null; }
                allEntries = [];
                trashEntries = [];
                renderDashboard();
            }
        });

        // 事件綁定
        themeToggle.addEventListener('click', function() {
            const next = { default:'dark', dark:'orange', orange:'default' };
            const current = themeSelect.value || 'default';
            setTheme(next[current] || 'default');
        });
        themeSelect.addEventListener('change', function() { setTheme(this.value); });
        currencySelect.addEventListener('change', function() {
            currencySymbol = this.value;
            localStorage.setItem('dahui_currency', currencySymbol);
            renderDashboard();
        });
        saveCatsBtn.addEventListener('click', function() {
            const val = customCats.value.split(',').map(s=>s.trim()).filter(Boolean);
            if (val.length===0) { alert('請輸入至少一個分類'); return; }
            localStorage.setItem('dahui_custom_cats', customCats.value);
            const datalist = document.getElementById('catSuggest');
            datalist.innerHTML = val.map(c => `<option value="${c}">`).join('');
            alert('分類已儲存！');
        });

        prevMonthBtn.addEventListener('click', function() {
            let m=currentMonth-1, y=currentYear;
            if (m<1) { m=12; y--; }
            currentYear=y; currentMonth=m;
            searchResults = [];
            renderDashboard();
        });
        nextMonthBtn.addEventListener('click', function() {
            let m=currentMonth+1, y=currentYear;
            if (m>12) { m=1; y++; }
            currentYear=y; currentMonth=m;
            searchResults = [];
            renderDashboard();
        });

        addBtn.addEventListener('click', function
