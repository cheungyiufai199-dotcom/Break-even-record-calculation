<script type="module">
import{initializeApp}from"firebase/app";

const firebaseConfig={apiKey:"AIzaSyBFfgFYyh1AGvpBYHdRUtHsnBz6pawPZOI",authDomain:"break-even-record-calculation.firebaseapp.com",projectId:"break-even-record-calculation",storageBucket:"break-even-record-calculation.firebasestorage.app",messagingSenderId:"963032266930",appId:"1:963032266930:web:23f60bb6409e55f1e371ab",measurementId:"G-0RH7CCVNB6"};
const app=initializeApp(firebaseConfig);

const DB={
  async getAll(){
    const q=query(collection(db,"records"),orderBy("date","desc"));
    const snap=await getDocs(q);
    const records=[];
    snap.forEach(d=>{
      const data=d.data();
      records.push({id:d.id,...data,amount:Number(data.amount)||0});
    });
    return records;
  },
  async add(record){
    const{id,...data}=record;
    const docRef=await addDoc(collection(db,"records"),{...data,amount:Number(data.amount),createdAt:new Date().toISOString()});
    return{id:docRef.id,...data};
  },
  async delete(id){await deleteDoc(doc(db,"records",id));},
  async clearAll(){
    const snap=await getDocs(collection(db,"records"));
    const batch=writeBatch(db);
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  },
  async exportData(){
    const records=await this.getAll();
    return JSON.stringify(records,null,2);
  },
  async importData(jsonStr){
    const data=JSON.parse(jsonStr);
    if(!Array.isArray(data))throw new Error('格式錯誤');
    await this.clearAll();
    for(const rec of data){
      const{id,...rest}=rec;
      await addDoc(collection(db,"records"),{...rest,amount:Number(rest.amount)||0,createdAt:rest.createdAt||new Date().toISOString()});
    }
    return true;
  },
  async count(){const snap=await getDocs(collection(db,"records"));return snap.size;},
  async getByMonth(year,month){
    const all=await this.getAll();
    return all.filter(r=>{
      const d=new Date(r.date);
      return d.getFullYear()===year&&d.getMonth()===month;
    });
  },
  async getSummary(year,month){
    const records=await this.getByMonth(year,month);
    let totalIncome=0,totalExpense=0,countIncome=0,countExpense=0;
    const incomeByCat={},expenseByCat={};
    for(const r of records){
      const amt=Number(r.amount)||0;
      const cat=r.mainCategory||r.category||'未分類';
      if(r.type==='income'){
        totalIncome+=amt;countIncome++;
        incomeByCat[cat]=(incomeByCat[cat]||0)+amt;
      }else{
        totalExpense+=amt;countExpense++;
        expenseByCat[cat]=(expenseByCat[cat]||0)+amt;
      }
    }
    return{totalIncome,totalExpense,countIncome,countExpense,balance:totalIncome-totalExpense,records,incomeByCat,expenseByCat};
  },
  async getTrend(year,month){
    const result=[];
    for(let i=5;i>=0;i--){
      const d=new Date(year,month-i,1);
      const y=d.getFullYear(),m=d.getMonth();
      const s=await this.getSummary(y,m);
      result.push({label:`${y}/${String(m+1).padStart(2,'0')}`,income:s.totalIncome,expense:s.totalExpense,balance:s.balance});
    }
    return result;
  }
};

// ===== 預算管理 (使用 setDoc 固定 ID) =====
const BudgetDB={
  async load(){
    const docRef=doc(db,"settings","budgets");
    const snap=await getDoc(docRef);
    if(snap.exists()){
      return snap.data();
    }else{

  },
  async save(budget){
    const docRef=doc(db,"settings","budgets");
    await setDoc(docRef,budget);
  }
};
