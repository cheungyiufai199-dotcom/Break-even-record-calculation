收支計算器
<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💰 收支管理 (雲端版)</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Firebase v9 模組 (透過 import map) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.4/firebase-analytics.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"
            }
        }
    </script>

    <style>
        /* ===== 原有 CSS 不變，只略為調整 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f5f7fb;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 28px 30px 40px;
            transition: all 0.2s;
        }
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 14px;
        }
        .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
        }
        .app-title i {
            color: #3b82f6;
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 6px 14px 6px 18px;
            border-radius: 40px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }
        .month-nav .month-label {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            min-width: 110px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .month-nav button {
            background: transparent;
            border: none;
            font-size: 18px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: #475569;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .month-nav button:hover {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .month-nav .btn-today {
            font-size: 13px;
            background: #e2e8f0;
            padding: 0 14px;
            border-radius: 30px;
            height: 32px;
            width: auto;
            color: #1e293b;
            font-weight: 500;
        }
        .month-nav .btn-today:hover {
            background: #cbd5e1;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .summary-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 18px 20px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef2f6;
            transition: 0.2s;
        }
        .summary-card:hover {
            border-color: #d1d9e6;
        }
        .summary-card .label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .summary-card .amount {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .summary-card .amount.income {
            color: #16a34a;
        }
        .summary-card .amount.expense {
            color: #dc2626;
        }
        .summary-card .amount.balance {
            color: #0f172a;
        }
        .summary-card .sub-info {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .card-income .label i {
            color: #16a34a;
        }
        .card-expense .label i {
            color: #dc2626;
        }
        .card-balance .label i {
            color: #3b82f6;
        }
        .form-section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px 24px 24px;
            margin-bottom: 28px;
            border: 1px solid #eef2f6;
        }
        .form-section .form-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
        }
        .form-group input,
        .form-group select {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 15px;
            color: #0f172a;
            transition: 0.2s;
            outline: none;
            width: 100%;
            min-width: 0;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .form-group input::placeholder {
            color: #b0b8c4;
        }
        .btn-add {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-add:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.30);
        }
        .btn-add:active {
            transform: translateY(0);
        }
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            background: #fafcfe;
            border-radius: 20px;
            padding: 16px 18px 12px;
            border: 1px solid #eef2f6;
            position: relative;
        }
        .chart-box .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chart-box canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 200px;
        }
        .chart-box .empty-chart {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }
        .records-section {
            margin-top: 6px;
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .records-header .record-count {
            font-size: 15px;
            color: #475569;
            font-weight: 500;
        }
        .records-header .record-count span {
            font-weight: 700;
            color: #0f172a;
        }
        .records-actions {
            display: flex;
            gap: 8px;
        }
        .records-actions button {
            background: #f1f5f9;
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .records-actions button:hover {
            background: #e2e8f0;
        }
        .records-actions .btn-danger {
            color: #b91c1c;
        }
        .records-actions .btn-danger:hover {
            background: #fee2e2;
        }
        .records-actions .btn-success {
            color: #15803d;
        }
        .records-actions .btn-success:hover {
            background: #dcfce7;
        }
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .record-item {
            display: grid;
            grid-template-columns: 90px 1fr 80px 100px 70px 44px;
            align-items: center;
            background: #fafcfe;
            border-radius: 14px;
            padding: 10px 16px;
            border: 1px solid #f1f5f9;
            transition: 0.15s;
            gap: 8px;
        }
        .record-item:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }
        .record-item .r-date {
            font-size: 14px;
            color: #475569;
            font-weight: 500;
        }
        .record-item .r-category {
            font-size: 14px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .record-item .r-category .badge {
            font-size: 11px;
            background: #e2e8f0;
            padding: 0 10px;
            border-radius: 30px;
            color: #475569;
            font-weight: 500;
        }
        .record-item .r-amount {
            font-size: 16px;
            font-weight: 600;
            text-align: right;
        }
        .record-item .r-amount.income {
            color: #16a34a;
        }
        .record-item .r-amount.expense {
            color: #dc2626;
        }
        .record-item .r-note {
            font-size: 13px;
            color: #94a3b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .record-item .r-type {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 2px 10px;
            border-radius: 30px;
            background: #e2e8f0;
            color: #475569;
            width: fit-content;
        }
        .record-item .r-type.income-badge {
            background: #dcfce7;
            color: #15803d;
        }
        .record-item .r-type.expense-badge {
            background: #fee2e2;
            color: #b91c1c;
        }
        .record-item .r-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-item .r-delete:hover {
            color: #dc2626;
            background: #fee2e2;
        }
        .empty-records {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
            font-size: 15px;
        }
        .empty-records i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.3;
        }
        .footer-actions {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1.5px solid #eef2f6;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }
        .footer-actions .left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .footer-actions button {
            background: #f1f5f9;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-actions button:hover {
            background: #e2e8f0;
        }
        .footer-actions .btn-outline-danger {
            color: #b91c1c;
        }
        .footer-actions .btn-outline-danger:hover {
            background: #fee2e2;
        }
        .footer-actions .btn-outline-success {
            color: #15803d;
        }
        .footer-actions .btn-outline-success:hover {
            background: #dcfce7;
        }
        .footer-actions .data-size {
            font-size: 13px;
            color: #94a3b8;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: #0f172a;
            color: #f8fafc;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.35s ease;
            backdrop-filter: blur(4px);
        }
        .toast.success {
            background: #065f46;
        }
        .toast.error {
            background: #991b1b;
        }
        .toast.info {
            background: #1e3a5f;
        }
        .toast i {
            font-size: 20px;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .hidden-input {
            display: none;
        }
        @media (max-width: 880px) {
            .app-container {
                padding: 18px 16px 30px;
            }
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
            .form-row .btn-add {
                grid-column: span 2;
                justify-content: center;
            }
            .charts-section {
                grid-template-columns: 1fr;
            }
            .record-item {
                grid-template-columns: 70px 1fr 70px 60px 40px;
                font-size: 13px;
                padding: 8px 12px;
                gap: 4px;
            }
            .record-item .r-note {
                display: none;
            }
            .record-item .r-date {
                font-size: 12px;
            }
            .record-item .r-amount {
                font-size: 14px;
            }
            .summary-cards {
                grid-template-columns: 1fr;
            }
            .summary-card .amount {
                font-size: 26px;
            }
            .app-title {
                font-size: 22px;
            }
            .month-nav .month-label {
                font-size: 16px;
                min-width: 80px;
            }
            .footer-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-actions .left {
                justify-content: center;
            }
            .footer-actions .data-size {
                text-align: center;
            }
        }
        @media (max-width: 480px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .month-nav {
                justify-content: space-between;
                padding: 4px 10px;
            }
            .month-nav .month-label {
                font-size: 15px;
                min-width: 70px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row .btn-add {
                grid-column: span 1;
            }
            .record-item {
                grid-template-columns: 60px 1fr 60px 36px;
                font-size: 12px;
                gap: 4px;
            }
            .record-item .r-type {
                display: none;
            }
            .record-item .r-category .badge {
                display: none;
            }
            .record-item .r-date {
                font-size: 11px;
            }
            .record-item .r-amount {
                font-size: 13px;
            }
            .record-item .r-delete {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- ===== 標頭 ===== -->
        <header class="app-header">
            <div class="app-title">
                <i class="fas fa-cloud"></i>
                <span>收支管理 (雲端)</span>
            </div>
            <div class="month-nav">
                <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                <span class="month-label" id="monthLabel">2026年8月</span>
                <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                <button id="todayBtn" class="btn-today"><i class="fas fa-calendar-alt"></i> 本月</button>
            </div>
        </header>

        <!-- ===== 總覽卡 ===== -->
        <section class="summary-cards">
            <div class="summary-card card-income">
                <div class="label"><i class="fas fa-arrow-up"></i> 總收入</div>
                <div class="amount income" id="totalIncome">HK$0</div>
                <div class="sub-info" id="incomeCount">0 筆</div>
            </div>
            <div class="summary-card card-expense">
                <div class="label"><i class="fas fa-arrow-down"></i> 總支出</div>
                <div class="amount expense" id="totalExpense">HK$0</div>
                <div class="sub-info" id="expenseCount">0 筆</div>
            </div>
            <div class="summary-card card-balance">
                <div class="label"><i class="fas fa-scale-balanced"></i> 結餘</div>
                <div class="amount balance" id="balance">HK$0</div>
                <div class="sub-info" id="balanceInfo">收支平衡</div>
            </div>
        </section>

        <!-- ===== 新增記錄 ===== -->
        <section class="form-section">
            <div class="form-title"><i class="fas fa-plus-circle" style="color:#3b82f6;"></i> 新增記錄</div>
            <form id="recordForm" class="form-row">
                <div class="form-group">
                    <label for="recordDate">日期</label>
                    <input type="date" id="recordDate" required />
                </div>
                <div class="form-group">
                    <l
